name: Website

# Builds the site in website/ (Next.js static export) and publishes it to
# GitHub Pages. Enable Pages once in the repository settings with
# Source = "GitHub Actions".

on:
    push:
        branches:
            - main
        paths:
            - "website/**"
            - "CHANGELOG.md"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# that is already publishing.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: website/package-lock.json

            - name: Configure Pages
              id: pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              working-directory: website
              run: npm ci

            # base_path is "/claude-parallel-profiles" on a project site and ""
            # on a custom domain; asset() and next.config.ts both read it.
            - name: Build
              working-directory: website
              run: npm run build
              env:
                  NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: website/out

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
